<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>弱点克服ノート</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up {
      animation: fadeInUp 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-modal {
      animation: modalFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Dragging styles */
    .folder-item.dragging {
      opacity: 0.5;
      scale: 0.98;
    }
    .folder-item.drag-over {
      border-color: #6366f1 !important;
      background-color: rgba(99, 102, 241, 0.1) !important;
      transform: scale(1.02);
    }

    /* Hidden element helper */
    .hidden-force {
      display: none !important;
    }

    /* Editable area content-editable styling */
    .rich-editor {
      min-height: 120px;
      outline: none;
    }
    .rich-editor:empty:before {
      content: attr(placeholder);
      color: #9ca3af;
      pointer-events: none;
      display: block;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-200 min-h-screen flex flex-col pb-20 select-none">

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none"></div>

  <!-- Context Menu -->
  <div id="contextMenu" class="fixed z-[90] hidden-force pointer-events-auto flex-col gap-1 bg-gray-900 dark:bg-gray-800 p-1.5 rounded-2xl shadow-2xl border border-gray-700 ring-4 ring-black/10">
    <button id="contextEditBtn" class="hover:bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition-all">
      <i data-lucide="edit-3" class="w-4 h-4"></i> 編集する
    </button>
    <button id="contextMoveBtn" class="hover:bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition-all">
      <i data-lucide="folder-output" class="w-4 h-4"></i> 移動する
    </button>
    <button id="contextDeleteBtn" class="hover:bg-red-600 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition-all">
      <i data-lucide="trash-2" class="w-4 h-4"></i> 削除する
    </button>
  </div>

  <!-- Hidden File Input for Loading State -->
  <input type="file" id="fileInput" accept=".json" class="hidden">
  <input type="file" id="imageAttachmentInput" accept="image/*" class="hidden">

  <header class="p-3 sticky top-0 z-30 flex items-center justify-between border-b bg-white dark:bg-gray-800 dark:border-gray-700 shadow-sm transition-colors">
    <!-- Left: Title & Settings -->
    <div class="flex-1 flex items-center gap-2">
      <h1 class="text-lg font-bold text-indigo-600 dark:text-indigo-400 hidden sm:block">弱点克服ノート</h1>
      <h1 class="text-lg font-bold text-indigo-600 dark:text-indigo-400 sm:hidden">弱点ノート</h1>
      <button onclick="openModal('settingsModal')" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition-colors" title="設定">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Center: Undo/Redo & Multi-select Toolbar -->
    <div class="flex items-center gap-2 justify-center flex-1">
      <div id="normalToolbar" class="flex items-center gap-2">
        <button id="undoBtn" onclick="undo()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition-colors disabled:opacity-30 disabled:hover:bg-transparent" title="戻る (Ctrl+Z)">
          <i data-lucide="undo-2" class="w-5 h-5"></i>
        </button>
        <button id="redoBtn" onclick="redo()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition-colors disabled:opacity-30 disabled:hover:bg-transparent" title="進む (Ctrl+Y)">
          <i data-lucide="redo-2" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Multi-select Controls (Visible only in selection mode) -->
      <div id="batchToolbar" class="hidden-force items-center gap-2">
        <button onclick="toggleSelectAll()" class="px-2.5 py-1.5 text-xs font-bold rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200">
          全選択
        </button>
        <button onclick="openBatchMoveModal()" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-blue-600 hover:bg-blue-700 text-white flex items-center gap-1 shadow-sm">
          <i data-lucide="folder-output" class="w-3.5 h-3.5"></i> 移動
        </button>
        <button onclick="openBatchDeleteModal()" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-red-600 hover:bg-red-700 text-white flex items-center gap-1 shadow-sm">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> 削除
        </button>
      </div>
    </div>

    <!-- Right: Actions & Batch Toggle Button -->
    <div class="flex items-center gap-1 sm:gap-2 justify-end flex-1">
      <button id="batchToggleBtn" onclick="toggleBatchMode()" class="px-2.5 py-1.5 text-xs font-bold rounded-xl border border-indigo-200 dark:border-indigo-800 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-900/40 transition-colors" title="一括選択">
        一括選択
      </button>

      <button onclick="openModal('saveModal')" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition-colors" title="ファイルに保存">
        <i data-lucide="save" class="w-5 h-5"></i>
      </button>
      <button onclick="openModal('loadModal')" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition-colors" title="データの読み込み">
        <i data-lucide="upload" class="w-5 h-5"></i>
      </button>
      <div class="w-px h-6 mx-1 bg-gray-200 dark:bg-gray-700"></div>
      
      <button onclick="openModal('memoModal')" class="p-2 rounded-full hover:bg-indigo-50 dark:hover:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 transition-colors" title="メモを記録（￥キー）">
        <i data-lucide="pen-square" class="w-6 h-6"></i>
      </button>
      <button onclick="openModal('folderModal')" class="p-2 rounded-full hover:bg-indigo-50 dark:hover:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 transition-colors" title="新規フォルダ">
        <i data-lucide="plus" class="w-7 h-7"></i>
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 w-full">
    <!-- Breadcrumbs -->
    <div id="breadcrumbs" class="flex items-center flex-wrap gap-1 mb-6 text-sm p-3 rounded-xl bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 shadow-sm border border-gray-100 dark:border-gray-700 transition-colors">
      <!-- Injected by JS -->
    </div>

    <!-- Folders Section -->
    <section class="mb-8">
      <h2 class="text-sm font-bold text-gray-500 dark:text-gray-400 mb-3 ml-1 flex items-center justify-between">
        <span class="flex items-center gap-2"><i data-lucide="folder" class="w-4 h-4"></i> フォルダ <span class="text-xs font-normal opacity-70">(長押し移動で並び替え)</span></span>
        <span id="folderBatchHint" class="text-xs text-indigo-500 hidden-force">※選択可能</span>
      </h2>
      <div id="foldersContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
        <!-- Injected by JS -->
      </div>
    </section>

    <!-- Memos Section -->
    <section>
      <h2 class="text-sm font-bold text-gray-500 dark:text-gray-400 mb-3 ml-1 flex items-center gap-2">
        <i data-lucide="file-text" class="w-4 h-4"></i> メモ書き (間違えた問題)
      </h2>
      <div id="memosContainer" class="flex flex-wrap gap-3">
        <!-- Injected by JS -->
      </div>
    </section>
  </main>

  <!-- Memo Modal (with Color Toolbar, Photo & Canvas Attachments) -->
  <div id="memoModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden-force items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden animate-modal border border-gray-100 dark:border-gray-700 flex flex-col max-h-[90vh]">
      <div class="flex justify-between items-center p-4 border-b border-gray-100 dark:border-gray-700">
        <h3 id="memoModalTitle" class="font-bold text-gray-800 dark:text-gray-100">記録を追加</h3>
        <button onclick="closeModal('memoModal')" class="text-gray-400 hover:text-gray-500"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="p-4 overflow-y-auto grow flex flex-col gap-3">
        <!-- Text Color Palette Toolbar -->
        <div class="flex items-center gap-2 p-1.5 bg-gray-100 dark:bg-gray-900 rounded-xl">
          <span class="text-xs font-medium text-gray-500 dark:text-gray-400 ml-1">文字色:</span>
          <button type="button" onclick="formatText('foreColor', '#1f2937')" class="w-6 h-6 rounded-full bg-gray-800 border border-white shadow-sm" title="黒"></button>
          <button type="button" onclick="formatText('foreColor', '#ef4444')" class="w-6 h-6 rounded-full bg-red-500 border border-white shadow-sm" title="赤"></button>
          <button type="button" onclick="formatText('foreColor', '#3b82f6')" class="w-6 h-6 rounded-full bg-blue-500 border border-white shadow-sm" title="青"></button>
          <button type="button" onclick="formatText('foreColor', '#22c55e')" class="w-6 h-6 rounded-full bg-green-500 border border-white shadow-sm" title="緑"></button>
          <button type="button" onclick="formatText('foreColor', '#eab308')" class="w-6 h-6 rounded-full bg-yellow-500 border border-white shadow-sm" title="黄"></button>
          <button type="button" onclick="formatText('foreColor', '#a855f7')" class="w-6 h-6 rounded-full bg-purple-500 border border-white shadow-sm" title="紫"></button>
        </div>

        <!-- Rich Input Editable Area -->
        <div id="memoInput" contenteditable="true" placeholder="間違えた問題の内容を入力..." class="rich-editor w-full px-4 py-3 border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all resize-y min-h-[120px]"></div>

        <!-- Attachment Tools -->
        <div id="mediaAttachmentTools" class="hidden-force flex items-center gap-2 pt-2 border-t border-gray-100 dark:border-gray-700">
          <button onclick="document.getElementById('imageAttachmentInput').click()" type="button" class="px-3 py-1.5 bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400 rounded-xl text-xs font-bold flex items-center gap-1.5 border border-indigo-100 dark:border-indigo-800 hover:bg-indigo-100 transition-colors">
            <i data-lucide="image" class="w-4 h-4"></i> 写真を追加
          </button>
          <button onclick="openCanvasModal()" type="button" class="px-3 py-1.5 bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400 rounded-xl text-xs font-bold flex items-center gap-1.5 border border-indigo-100 dark:border-indigo-800 hover:bg-indigo-100 transition-colors">
            <i data-lucide="pen-tool" class="w-4 h-4"></i> 手書き/お絵かき
          </button>
        </div>

        <!-- Preview Attached Media -->
        <div id="attachedImagePreview" class="relative hidden-force mt-2 inline-block max-w-full">
          <img id="attachedImg" src="" class="max-h-48 rounded-xl border border-gray-200 dark:border-gray-700 object-contain bg-black/5">
          <button onclick="removeAttachedImage()" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full p-1 shadow-md hover:bg-red-700">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
      <div class="p-4 border-t border-gray-100 dark:border-gray-700 flex gap-3">
        <button onclick="closeModal('memoModal')" class="flex-1 py-3 rounded-xl font-medium transition-colors bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">キャンセル</button>
        <button onclick="saveMemo()" class="flex-1 py-3 text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 font-medium transition-colors">完了</button>
      </div>
    </div>
  </div>

  <!-- Drawing/Canvas Modal -->
  <div id="drawModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden-force items-center justify-center p-4 z-[60]">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-modal border border-gray-100 dark:border-gray-700 flex flex-col">
      <div class="flex justify-between items-center p-3 border-b border-gray-100 dark:border-gray-700">
        <h3 class="font-bold text-gray-800 dark:text-gray-100 flex items-center gap-1.5"><i data-lucide="pen-tool" class="w-4 h-4"></i> お絵かき・手書き</h3>
        <button onclick="closeModal('drawModal')" class="text-gray-400 hover:text-gray-500"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="p-3 flex flex-col items-center gap-3">
        <!-- Tools toolbar -->
        <div class="flex items-center gap-3 w-full justify-between">
          <div class="flex items-center gap-1">
            <button onclick="setPenColor('#000000')" class="w-6 h-6 rounded-full bg-black border border-white shadow-sm"></button>
            <button onclick="setPenColor('#ef4444')" class="w-6 h-6 rounded-full bg-red-500 border border-white shadow-sm"></button>
            <button onclick="setPenColor('#3b82f6')" class="w-6 h-6 rounded-full bg-blue-500 border border-white shadow-sm"></button>
            <button onclick="setPenColor('#22c55e')" class="w-6 h-6 rounded-full bg-green-500 border border-white shadow-sm"></button>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs text-gray-500">太さ</span>
            <input type="range" id="penSize" min="1" max="20" value="3" class="w-20">
          </div>
          <button onclick="clearCanvas()" class="px-2 py-1 text-xs bg-gray-200 dark:bg-gray-700 rounded-lg">全消去</button>
        </div>
        <!-- Canvas Element -->
        <canvas id="paintCanvas" width="360" height="260" class="border rounded-xl bg-white touch-none cursor-crosshair w-full h-[260px] border-gray-300 dark:border-gray-600 shadow-inner"></canvas>
      </div>
      <div class="p-3 border-t border-gray-100 dark:border-gray-700 flex gap-3">
        <button onclick="closeModal('drawModal')" class="flex-1 py-2.5 rounded-xl font-medium bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">キャンセル</button>
        <button onclick="applyCanvasDrawing()" class="flex-1 py-2.5 text-white bg-indigo-600 rounded-xl font-medium">画像として添付</button>
      </div>
    </div>
  </div>

  <!-- Folder Modal (Add / Edit) -->
  <div id="folderModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden-force items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden animate-modal border border-gray-100 dark:border-gray-700">
      <div class="flex justify-between items-center p-4 border-b border-gray-100 dark:border-gray-700">
        <h3 id="folderModalTitle" class="font-bold text-gray-800 dark:text-gray-100">新規フォルダ</h3>
        <button onclick="closeModal('folderModal')" class="text-gray-400 hover:text-gray-500"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="p-4">
        <input type="text" id="folderInput" placeholder="フォルダ名を入力..." class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
        <div class="mt-6 flex gap-3">
          <button onclick="closeModal('folderModal')" class="flex-1 py-3 rounded-xl font-medium transition-colors bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">キャンセル</button>
          <button onclick="saveFolder()" class="flex-1 py-3 text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 font-medium transition-colors">決定</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Batch Move Modal -->
  <div id="batchMoveModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden-force items-center justify-center p-4 z-[80]">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-modal border border-gray-100 dark:border-gray-700 flex flex-col max-h-[85vh]">
      <div class="flex justify-between items-center p-4 border-b border-gray-100 dark:border-gray-700">
        <h3 class="font-bold text-gray-800 dark:text-gray-100 flex items-center gap-2"><i data-lucide="folder-output" class="w-5 h-5 text-indigo-500"></i> 移動先を選択</h3>
        <button onclick="closeModal('batchMoveModal')" class="text-gray-400 hover:text-gray-500"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="folderTreeContainer" class="p-4 overflow-y-auto grow space-y-1">
        <!-- Injected folder tree UI -->
      </div>
      <div class="p-4 border-t border-gray-100 dark:border-gray-700 flex gap-3">
        <button onclick="closeModal('batchMoveModal')" class="flex-1 py-3 rounded-xl font-medium bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">キャンセル</button>
        <button onclick="executeBatchMove()" class="flex-1 py-3 text-white bg-indigo-600 rounded-xl font-medium hover:bg-indigo-700 transition-colors">ここへ移動</button>
      </div>
    </div>
  </div>

  <!-- Batch Delete Confirmation Modal -->
  <div id="batchDeleteConfirmModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden-force items-center justify-center p-4 z-[80]">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden animate-modal border border-red-100 dark:border-red-900/30">
      <div class="flex flex-col items-center justify-center p-6 border-b bg-red-50 dark:bg-red-900/20 border-red-100 dark:border-red-900/50 text-red-600 dark:text-red-400">
        <i data-lucide="alert-triangle" class="w-12 h-12 mb-2"></i>
        <h3 class="font-bold text-lg">一括削除の確認</h3>
      </div>
      <div class="p-4">
        <p id="batchDeleteMsg" class="text-sm text-center mb-6 text-gray-600 dark:text-gray-300">
          選択した項目を本当に削除しますか？
        </p>
        <div class="flex gap-3">
          <button onclick="closeModal('batchDeleteConfirmModal')" class="flex-1 py-3 rounded-xl font-medium transition-colors bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">キャンセル</button>
          <button onclick="executeBatchDelete()" class="flex-1 py-3 text-white bg-red-600 rounded-xl hover:bg-red-700 font-medium transition-colors shadow-lg shadow-red-500/30">削除する</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Single Move Folder Modal -->
  <div id="moveModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden-force items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden animate-modal border border-gray-100 dark:border-gray-700">
      <div class="flex justify-between items-center p-4 border-b border-gray-100 dark:border-gray-700">
        <h3 class="font-bold text-gray-800 dark:text-gray-100">フォルダを移動</h3>
        <button onclick="closeModal('moveModal')" class="text-gray-400 hover:text-gray-500"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="p-4">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1 ml-1">移動先フォルダ</label>
        <select id="moveTargetSelect" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
          <!-- Injected by JS -->
        </select>
        <div class="mt-6 flex gap-3">
          <button onclick="closeModal('moveModal')" class="flex-1 py-3 rounded-xl font-medium transition-colors bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">キャンセル</button>
          <button onclick="executeFolderMove()" class="flex-1 py-3 text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 font-medium transition-colors">移動する</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Save Modal -->
  <div id="saveModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden-force items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden animate-modal border border-gray-100 dark:border-gray-700">
      <div class="flex justify-between items-center p-4 border-b border-gray-100 dark:border-gray-700">
        <h3 class="font-bold text-gray-800 dark:text-gray-100">ファイルに保存</h3>
        <button onclick="closeModal('saveModal')" class="text-gray-400 hover:text-gray-500"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="p-4">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1 ml-1">ファイル名</label>
        <div class="flex items-center gap-2">
          <input type="text" id="saveFileNameInput" value="mistake_notes" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
          <span class="text-gray-500 dark:text-gray-400 font-medium">.json</span>
        </div>
        <div class="mt-6 flex gap-3">
          <button onclick="closeModal('saveModal')" class="flex-1 py-3 rounded-xl font-medium transition-colors bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">キャンセル</button>

  <script>
    // --- Utilities ---
    const generateId = () => Math.random().toString(36).substring(2, 9);
    const escapeHTML = (str) => {
      if(!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag]));
    };

    const COLOR_OPTIONS = [
      { value: 'red', label: '赤色' },
      { value: 'pink', label: 'ピンク色' },
      { value: 'orange', label: 'オレンジ色' },
      { value: 'yellow', label: '黄色' },
      { value: 'green', label: '緑色' },
      { value: 'teal', label: '青緑色' },
      { value: 'blue', label: '青色' },
      { value: 'indigo', label: '藍色' },
      { value: 'purple', label: '紫色' },
      { value: 'gray', label: '灰色' },
    ];

    // --- Application State ---
    let appState = {
      folders: [{ id: 'root', name: 'すべてのノート', parentId: null }],
      memos: []
    };
    
    let defaultSettings = {
      theme: 'light',
      fontSize: 'medium',
      enterToSubmit: true,
      batchIncludeFolders: true,
      enableMediaAttachments: true,
      colorRules: [
        { id: 'r1', count: 3, color: 'red' },
        { id: 'r2', count: 2, color: 'orange' }
      ]
    };
    let settings = { ...defaultSettings };

    let currentFolderId = 'root';
    let pastHistory = [];
    let futureHistory = [];

    // Selection Mode State
    let isBatchMode = false;
    let selectedFolderIds = new Set();
    let selectedMemoIds = new Set();
    let selectedTargetFolderForBatchMove = null;

    // Editing context
    let editingMemoId = null;
    let editingFolderId = null;
    let currentImageAttachment = null; // Base64 string

    // Long press and drag logic
    let pointerTimer = null;
    let contextMenuData = null; // { type, id, x, y }
    let folderToMove = null; 

    let isLongPressed = false;
    let isDraggingFolder = false;
    let draggedFolderId = null;
    let dragStartCoords = { x: 0, y: 0 };
    let longPressTriggeredPos = { x: 0, y: 0 };

    // Canvas State
    let isDrawing = false;
    let penColor = '#000000';
    let canvasCtx = null;

    // --- Initialize ---
    function init() {
      const savedData = localStorage.getItem('mistake_app_data');
      if (savedData) {
        try {
          const parsed = JSON.parse(savedData);
          if (parsed.folders && parsed.memos) appState = parsed;
        } catch(e) {}
      }

      const savedSettings = localStorage.getItem('mistake_app_settings');
      if (savedSettings) {
        try {
          settings = { ...defaultSettings, ...JSON.parse(savedSettings) };
        } catch(e) {}
      }

      applyTheme();
      renderAll();
      setupEventListeners();
      setupCanvas();
      lucide.createIcons();
    }

    function saveToStorage() {
      localStorage.setItem('mistake_app_data', JSON.stringify(appState));
    }
    
    function saveSettings() {
      localStorage.setItem('mistake_app_settings', JSON.stringify(settings));
      applyTheme();
      renderAll();
    }

    function toggleSetting(key) {
      settings[key] = !settings[key];
      saveSettings();
    }

    function setTheme(theme) {
      settings.theme = theme;
      saveSettings();
    }

    function setFontSize(size) {
      settings.fontSize = size;
      saveSettings();
    }

    // --- History (Undo/Redo) ---
    function updateState(newState) {
      pastHistory.push(JSON.parse(JSON.stringify(appState)));
      appState = JSON.parse(JSON.stringify(newState));
      futureHistory = [];
      saveToStorage();
      renderAll();
    }

    function undo() {
      if (pastHistory.length === 0) return;
      const previous = pastHistory.pop();
      futureHistory.push(JSON.parse(JSON.stringify(appState)));
      appState = previous;
      saveToStorage();
      renderAll();
    }

    function redo() {
      if (futureHistory.length === 0) return;
      const next = futureHistory.pop();
      pastHistory.push(JSON.parse(JSON.stringify(appState)));
      appState = next;
      saveToStorage();
      renderAll();
    }

    // --- Rendering ---
    function renderAll() {
      renderBreadcrumbs();
      renderFolders();
      renderMemos();
      updateButtons();
      renderSettingsModal();
      updateMediaAttachmentUI();
      lucide.createIcons();
    }

    function updateButtons() {
      document.getElementById('undoBtn').disabled = pastHistory.length === 0;
      document.getElementById('redoBtn').disabled = futureHistory.length === 0;

      const normalTb = document.getElementById('normalToolbar');
      const batchTb = document.getElementById('batchToolbar');
      const batchBtn = document.getElementById('batchToggleBtn');
      const folderHint = document.getElementById('folderBatchHint');

      if (isBatchMode) {
        normalTb.classList.add('hidden-force');
        batchTb.classList.remove('hidden-force');
        batchTb.classList.add('flex');
        batchBtn.classList.add('bg-indigo-600', 'text-white');
        batchBtn.classList.remove('border', 'text-indigo-600');
        batchBtn.textContent = `選択完了 (${selectedFolderIds.size + selectedMemoIds.size})`;

        if (settings.batchIncludeFolders) {
          folderHint.classList.remove('hidden-force');
        } else {
          folderHint.classList.add('hidden-force');
        }
      } else {
        normalTb.classList.remove('hidden-force');
        batchTb.classList.add('hidden-force');
        batchTb.classList.remove('flex');
        batchBtn.classList.remove('bg-indigo-600', 'text-white');
        batchBtn.classList.add('border', 'text-indigo-600');
        batchBtn.textContent = '一括選択';
        folderHint.classList.add('hidden-force');
      }
    }

    function applyTheme() {
      if (settings.theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    function updateMediaAttachmentUI() {
      const tools = document.getElementById('mediaAttachmentTools');
      if (settings.enableMediaAttachments) {
        tools.classList.remove('hidden-force');
      } else {
        tools.classList.add('hidden-force');
      }
    }

    function renderBreadcrumbs() {
      const container = document.getElementById('breadcrumbs');
      const crumbs = [];
      let currId = currentFolderId;
      
      while (currId) {
        const folder = appState.folders.find(f => f.id === currId);
        if (folder) {
          crumbs.unshift(folder);
          currId = folder.parentId;
        } else {
          break;
        }
      }

      container.innerHTML = crumbs.map((crumb, index) => {
        const isLast = index === crumbs.length - 1;
        const classes = isLast 
          ? "font-bold text-gray-900 dark:text-white" 
          : "hover:text-indigo-500 cursor-pointer transition-colors";
        
        return `<span class="py-1 ${classes}" ${!isLast ? `onclick="changeFolder('${crumb.id}')"` : ''}>
                  ${escapeHTML(crumb.name)}
                </span>
                ${!isLast ? `<i data-lucide="chevron-right" class="w-4 h-4 mx-1"></i>` : ''}`;
      }).join('');
    }

    function renderFolders() {
      const container = document.getElementById('foldersContainer');
      const childFolders = appState.folders.filter(f => f.parentId === currentFolderId);
      
      if (childFolders.length === 0) {
        container.innerHTML = `<p class="text-gray-400 text-sm ml-2">フォルダはありません</p>`;
        return;
      }

      container.innerHTML = '';
      childFolders.forEach(folder => {
        const div = document.createElement('div');
        const isSelected = selectedFolderIds.has(folder.id);
        
        div.className = `folder-item bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border ${isSelected ? 'border-indigo-600 ring-2 ring-indigo-500/30' : 'border-gray-100 dark:border-gray-700'} hover:border-indigo-300 dark:hover:border-indigo-500 cursor-pointer flex items-center justify-between group transition-all select-none`;
        div.dataset.folderId = folder.id;

        div.addEventListener('pointerdown', (e) => onFolderPointerDown(e, folder.id));
        div.addEventListener('pointermove', (e) => onFolderPointerMove(e, folder.id));
        div.addEventListener('pointerup', (e) => onFolderPointerUp(e, folder.id));
        div.addEventListener('pointercancel', (e) => onFolderPointerCancel(e));
        div.addEventListener('contextmenu', e => e.preventDefault());

        const selectIcon = (isBatchMode && settings.batchIncludeFolders) ? `
          <div class="w-5 h-5 rounded-md border flex items-center justify-center ${isSelected ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-gray-300 dark:border-gray-600'}">
            ${isSelected ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}
          </div>
        ` : '';

        div.innerHTML = `
          <div class="flex items-center gap-3 w-full pointer-events-none">
            ${selectIcon}
            <div class="text-indigo-500 dark:text-indigo-400">
              <i data-lucide="folder" class="w-6 h-6"></i>
            </div>
            <span class="font-medium text-gray-700 dark:text-gray-200 truncate flex-1">${escapeHTML(folder.name)}</span>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // --- Folder Pointer / Drag & Drop / Long Press ---
    function onFolderPointerDown(e, folderId) {
      if (e.button !== 0 && e.button !== undefined) return;
      hideContextMenu();

      const x = e.clientX || (e.touches && e.touches[0].clientX);
      const y = e.clientY || (e.touches && e.touches[0].clientY);

      dragStartCoords = { x, y };
      draggedFolderId = folderId;
      isLongPressed = false;
      isDraggingFolder = false;

      pointerTimer = setTimeout(() => {
        isLongPressed = true;
        longPressTriggeredPos = { x, y };
        if (navigator.vibrate) navigator.vibrate(50);
      }, 500);
    }

    function onFolderPointerMove(e, folderId) {
      if (!draggedFolderId) return;

      const x = e.clientX || (e.touches && e.touches[0].clientX);
      const y = e.clientY || (e.touches && e.touches[0].clientY);
      const dist = Math.hypot(x - dragStartCoords.x, y - dragStartCoords.y);

      if (!isLongPressed && dist > 10) {
        if (pointerTimer) {
          clearTimeout(pointerTimer);
          pointerTimer = null;
        }
        return;
      }

      if (isLongPressed && dist > 8 && !isBatchMode) {
        if (!isDraggingFolder) {
          isDraggingFolder = true;
          const draggedElem = document.querySelector(`.folder-item[data-folder-id="${draggedFolderId}"]`);
          if (draggedElem) draggedElem.classList.add('dragging');
        }

        const elemBelow = document.elementFromPoint(x, y);
        const folderElemBelow = elemBelow ? elemBelow.closest('.folder-item') : null;

        document.querySelectorAll('.folder-item').forEach(el => el.classList.remove('drag-over'));
        if (folderElemBelow && folderElemBelow.dataset.folderId !== draggedFolderId) {
          folderElemBelow.classList.add('drag-over');
        }
      }
    }

    function onFolderPointerUp(e, folderId) {
      if (pointerTimer) {
        clearTimeout(pointerTimer);
        pointerTimer = null;
      }

      const x = e.clientX || (e.changedTouches && e.changedTouches[0].clientX) || dragStartCoords.x;
      const y = e.clientY || (e.changedTouches && e.changedTouches[0].clientY) || dragStartCoords.y;

      if (isDraggingFolder) {
        const elemBelow = document.elementFromPoint(x, y);
        const folderElemBelow = elemBelow ? elemBelow.closest('.folder-item') : null;

        if (folderElemBelow && folderElemBelow.dataset.folderId !== draggedFolderId) {
          const targetId = folderElemBelow.dataset.folderId;
          swapFolders(draggedFolderId, targetId);
          showToast('フォルダの位置を入れ替えました');
        }
      } else if (isLongPressed) {
        if (isBatchMode) {
          toggleFolderSelection(folderId);
        } else {
          contextMenuData = { type: 'folder', id: folderId, x: longPressTriggeredPos.x, y: longPressTriggeredPos.y };
          showContextMenu();
        }
      } else {
        if (isBatchMode) {
          if (settings.batchIncludeFolders) {
            toggleFolderSelection(folderId);
          } else {
            changeFolder(folderId);
          }
        } else if (!contextMenuData) {
          changeFolder(folderId);
        }
      }

      cleanupFolderDragState();
    }

    function onFolderPointerCancel(e) {
      if (pointerTimer) {
        clearTimeout(pointerTimer);
        pointerTimer = null;
      }
      cleanupFolderDragState();
    }

    function cleanupFolderDragState() {
      document.querySelectorAll('.folder-item').forEach(el => {
        el.classList.remove('dragging', 'drag-over');
      });
      isLongPressed = false;
      isDraggingFolder = false;
      draggedFolderId = null;
    }

    function swapFolders(id1, id2) {
      const idx1 = appState.folders.findIndex(f => f.id === id1);
      const idx2 = appState.folders.findIndex(f => f.id === id2);

      if (idx1 !== -1 && idx2 !== -1) {
        const newState = { ...appState, folders: [...appState.folders] };
        const temp = newState.folders[idx1];
        newState.folders[idx1] = newState.folders[idx2];
        newState.folders[idx2] = temp;
        updateState(newState);
      }
    }

    // Color mapper for Memos
    function getColorClasses(count) {
      const sortedRules = [...settings.colorRules].sort((a, b) => b.count - a.count);
      const matchedRule = sortedRules.find(rule => count >= rule.count);
      const base = matchedRule ? matchedRule.color : 'default';
      const isDark = settings.theme === 'dark';

      const map = {
        red: {
          light: 'bg-red-50 border-red-200 text-red-800', badgeLight: 'bg-red-500 text-white',
          dark: 'bg-red-900/20 border-red-800/50 text-red-200', badgeDark: 'bg-red-900 text-red-200 border border-red-700'
        },
        pink: {
          light: 'bg-pink-50 border-pink-200 text-pink-800', badgeLight: 'bg-pink-500 text-white',
          dark: 'bg-pink-900/20 border-pink-800/50 text-pink-200', badgeDark: 'bg-pink-900 text-pink-200 border border-pink-700'
        },
        orange: {
          light: 'bg-orange-50 border-orange-200 text-orange-800', badgeLight: 'bg-orange-500 text-white',
          dark: 'bg-orange-900/20 border-orange-800/50 text-orange-200', badgeDark: 'bg-orange-900 text-orange-200 border border-orange-700'
        },
        yellow: {
          light: 'bg-yellow-50 border-yellow-200 text-yellow-900', badgeLight: 'bg-yellow-500 text-gray-900',
          dark: 'bg-yellow-900/20 border-yellow-800/50 text-yellow-200', badgeDark: 'bg-yellow-900 text-yellow-200 border border-yellow-700'
        },
        green: {
          light: 'bg-green-50 border-green-200 text-green-800', badgeLight: 'bg-green-500 text-white',
          dark: 'bg-green-900/20 border-green-800/50 text-green-200', badgeDark: 'bg-green-900 text-green-200 border border-green-700'
        },
        teal: {
          light: 'bg-teal-50 border-teal-200 text-teal-800', badgeLight: 'bg-teal-500 text-white',
          dark: 'bg-teal-900/20 border-teal-800/50 text-teal-200', badgeDark: 'bg-teal-900 text-teal-200 border border-teal-700'
        },
        blue: {
          light: 'bg-blue-50 border-blue-200 text-blue-800', badgeLight: 'bg-blue-500 text-white',
          dark: 'bg-blue-900/20 border-blue-800/50 text-blue-200', badgeDark: 'bg-blue-900 text-blue-200 border border-blue-700'
        },
        indigo: {
          light: 'bg-indigo-50 border-indigo-200 text-indigo-800', badgeLight: 'bg-indigo-500 text-white',
          dark: 'bg-indigo-900/20 border-indigo-800/50 text-indigo-200', badgeDark: 'bg-indigo-900 text-indigo-200 border border-indigo-700'
        },
        purple: {
          light: 'bg-purple-50 border-purple-200 text-purple-800', badgeLight: 'bg-purple-500 text-white',
          dark: 'bg-purple-900/20 border-purple-800/50 text-purple-200', badgeDark: 'bg-purple-900 text-purple-200 border border-purple-700'
        },
        gray: {
          light: 'bg-gray-50 border-gray-300 text-gray-800', badgeLight: 'bg-gray-500 text-white',
          dark: 'bg-gray-800/50 border-gray-600 text-gray-300', badgeDark: 'bg-gray-700 text-gray-300 border border-gray-600'
        },
        default: {
          light: 'bg-white border-gray-100 text-gray-800', badgeLight: 'bg-gray-100 text-gray-600',
          dark: 'bg-gray-800 border-gray-700 text-gray-200', badgeDark: 'bg-gray-700 text-gray-300'
        }
      };

      const c = map[base] || map.default;
      return {
        box: isDark ? c.dark : c.light,
        badge: isDark ? c.badgeDark : c.badgeLight
      };
    }

    function renderMemos() {
      const container = document.getElementById('memosContainer');
      const memos = appState.memos
        .filter(m => m.folderId === currentFolderId)
        .sort((a, b) => b.count - a.count);

      if (memos.length === 0) {
        container.innerHTML = `<p class="text-gray-400 text-sm ml-2">メモはありません</p>`;
        return;
      }

      container.innerHTML = '';
      memos.forEach(memo => {
        const colors = getColorClasses(memo.count);
        const isSelected = selectedMemoIds.has(memo.id);
        const div = document.createElement('div');
        div.className = `relative flex-auto min-w-[200px] max-w-full p-4 rounded-xl border transition-all flex items-start justify-between gap-4 group select-none cursor-pointer shadow-sm ${isSelected ? 'border-indigo-600 ring-2 ring-indigo-500/30' : colors.box}`;
        
        div.addEventListener('pointerdown', (e) => onMemoPointerDown(e, 'memo', memo.id));
        div.addEventListener('pointerup', onMemoPointerUpOrMove);
        div.addEventListener('pointermove', onMemoPointerUpOrMove);
        div.addEventListener('pointercancel', onMemoPointerUpOrMove);
        div.addEventListener('contextmenu', e => e.preventDefault());
        
        div.addEventListener('click', () => {
          if (isBatchMode) {
            toggleMemoSelection(memo.id);
          } else if (!contextMenuData) {
            copyToClipboard(memo.text);
          }
        });

        const fontSizeClass = settings.fontSize === 'small' ? 'text-xs md:text-sm' : 
                              settings.fontSize === 'large' ? 'text-base md:text-xl' : 
                              'text-sm md:text-base';

        const selectIcon = isBatchMode ? `
          <div class="w-5 h-5 rounded-md border flex items-center justify-center shrink-0 ${isSelected ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-gray-300 dark:border-gray-600'}">
            ${isSelected ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}
          </div>
        ` : '';

        const attachedImgHTML = memo.imageUrl ? `
          <div class="mt-2">
            <img src="${memo.imageUrl}" class="max-h-40 rounded-lg border border-black/10 dark:border-white/10 object-contain">
          </div>
        ` : '';

        div.innerHTML = `
          <div class="flex gap-3 w-full items-start">
            ${selectIcon}
            <div class="flex-1 overflow-hidden">
              <div class="whitespace-pre-wrap break-words leading-relaxed pointer-events-none ${fontSizeClass}">
                ${memo.html || escapeHTML(memo.text)}
              </div>
              ${attachedImgHTML}
            </div>
            <div class="flex flex-col items-end gap-2 shrink-0 pointer-events-none">
              <div class="flex items-center justify-center px-3 py-1 rounded-full font-bold text-sm ${colors.badge}">
                × ${memo.count}
              </div>
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function onMemoPointerDown(e, type, id) {
      if (e.button !== 0 && e.button !== undefined) return;
      hideContextMenu();
      
      const x = e.clientX || (e.touches && e.touches[0].clientX);
      const y = e.clientY || (e.touches && e.touches[0].clientY);

      pointerTimer = setTimeout(() => {
        if (isBatchMode) {
          toggleMemoSelection(id);
        } else {
          contextMenuData = { type, id, x, y };
          if (navigator.vibrate) navigator.vibrate(50);
          showContextMenu();
        }
      }, 600);
    }

    function onMemoPointerUpOrMove() {
      if (pointerTimer) {
        clearTimeout(pointerTimer);
        pointerTimer = null;
      }
    }

    // --- Multi-Select Batch Operations ---
    function toggleBatchMode() {
      isBatchMode = !isBatchMode;
      selectedFolderIds.clear();
      selectedMemoIds.clear();
      renderAll();
    }

    function toggleFolderSelection(id) {
      if (selectedFolderIds.has(id)) selectedFolderIds.delete(id);
      else selectedFolderIds.add(id);
      renderAll();
    }

    function toggleMemoSelection(id) {
      if (selectedMemoIds.has(id)) selectedMemoIds.delete(id);
      else selectedMemoIds.add(id);
      renderAll();
    }

    function toggleSelectAll() {
      const childFolders = appState.folders.filter(f => f.parentId === currentFolderId);
      const childMemos = appState.memos.filter(m => m.folderId === currentFolderId);

      const allFoldersSelected = settings.batchIncludeFolders && childFolders.every(f => selectedFolderIds.has(f.id));
      const allMemosSelected = childMemos.every(m => selectedMemoIds.has(m.id));

      if (allFoldersSelected && allMemosSelected) {
        selectedFolderIds.clear();
        selectedMemoIds.clear();
      } else {
        if (settings.batchIncludeFolders) {
          childFolders.forEach(f => selectedFolderIds.add(f.id));
        }
        childMemos.forEach(m => selectedMemoIds.add(m.id));
      }
      renderAll();
    }

    function openBatchDeleteModal() {
      const total = selectedFolderIds.size + selectedMemoIds.size;
      if (total === 0) {
        showToast('項目が選択されていません');
        return;
      }
      document.getElementById('batchDeleteMsg').textContent = `選択した ${total} 個の項目（フォルダ/メモ）を本当に削除しますか？`;
      openModal('batchDeleteConfirmModal');
    }

    function executeBatchDelete() {
      const newState = {
        folders: appState.folders.filter(f => !selectedFolderIds.has(f.id)),
        memos: appState.memos.filter(m => !selectedMemoIds.has(m.id))
      };
      updateState(newState);
      selectedFolderIds.clear();
      selectedMemoIds.clear();
      closeModal('batchDeleteConfirmModal');
      showToast('選択した項目を削除しました');
    }

    function openBatchMoveModal() {
      const total = selectedFolderIds.size + selectedMemoIds.size;
      if (total === 0) {
        showToast('項目が選択されていません');
        return;
      }
      renderFolderTree();
      openModal('batchMoveModal');
    }

    function renderFolderTree() {
      const container = document.getElementById('folderTreeContainer');
      container.innerHTML = '';
      selectedTargetFolderForBatchMove = 'root';

      function buildTreeHTML(parentId, level = 0) {
        const children = appState.folders.filter(f => f.parentId === parentId);
        let html = '';
        children.forEach(folder => {
          if (selectedFolderIds.has(folder.id)) return;

          const isSelected = selectedTargetFolderForBatchMove === folder.id;
          const padding = level * 16 + 12;

          html += `
            <div onclick="selectBatchMoveTarget('${folder.id}')" id="tree-node-${folder.id}" class="folder-tree-node flex items-center gap-2 p-2.5 rounded-xl cursor-pointer hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition-colors border ${isSelected ? 'border-indigo-600 bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 font-bold' : 'border-transparent text-gray-700 dark:text-gray-200'}" style="padding-left: ${padding}px;">
              <i data-lucide="folder" class="w-4 h-4 text-indigo-500 shrink-0"></i>
              <span class="text-sm truncate">${escapeHTML(folder.name)}</span>
            </div>
          `;
          html += buildTreeHTML(folder.id, level + 1);
        });
        return html;
      }

      container.innerHTML = buildTreeHTML(null, 0);
      lucide.createIcons();
    }

    function selectBatchMoveTarget(id) {
      selectedTargetFolderForBatchMove = id;
      document.querySelectorAll('.folder-tree-node').forEach(node => {
        node.classList.remove('border-indigo-600', 'bg-indigo-50', 'dark:bg-indigo-900/40', 'text-indigo-600', 'font-bold');
        node.classList.add('border-transparent');
      });
      const selectedNode = document.getElementById(`tree-node-${id}`);
      if (selectedNode) {
        selectedNode.classList.add('border-indigo-600', 'bg-indigo-50', 'dark:bg-indigo-900/40', 'text-indigo-600', 'font-bold');
        selectedNode.classList.remove('border-transparent');
      }
    }

    function executeBatchMove() {
      if (!selectedTargetFolderForBatchMove) return;

      const newState = {
        folders: appState.folders.map(f => {
          if (selectedFolderIds.has(f.id)) return { ...f, parentId: selectedTargetFolderForBatchMove };
          return f;
        }),
        memos: appState.memos.map(m => {
          if (selectedMemoIds.has(m.id)) return { ...m, folderId: selectedTargetFolderForBatchMove };
          return m;
        })
      };

      updateState(newState);
      selectedFolderIds.clear();
      selectedMemoIds.clear();
      closeModal('batchMoveModal');
      showToast('選択した項目を移動しました');
    }

    // --- Rich Text Editor & CRUD Operations ---
    function formatText(cmd, value = null) {
      document.execCommand(cmd, false, value);
    }

    function copyToClipboard(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "absolute";
      textArea.style.left = "-999999px";
      document.body.prepend(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showToast('メモをコピーしました');
      } catch (error) {
        showToast('コピーに失敗しました');
      } finally {
        textArea.remove();
      }
    }

    function changeFolder(id) {
      currentFolderId = id;
      renderAll();
    }

    function saveMemo() {
      const editor = document.getElementById('memoInput');
      const htmlContent = editor.innerHTML.trim();
      const textContent = editor.innerText.trim();

      if (!textContent && !htmlContent && !currentImageAttachment) {
        showToast('内容が入力されていません');
        return;
      }

      if (editingMemoId) {
        const newState = {
          ...appState,
          memos: appState.memos.map(m => {
            if (m.id === editingMemoId) {
              return {
                ...m,
                html: htmlContent,
                text: textContent,
                imageUrl: currentImageAttachment
              };
            }
            return m;
          })
        };
        updateState(newState);
        showToast('メモを更新しました');
      } else {
        const duplicateIndex = appState.memos.findIndex(m => 
          m.folderId === currentFolderId && (m.text === textContent || (m.html && m.html === htmlContent))
        );

        if (duplicateIndex !== -1) {
          const newState = { ...appState, memos: [...appState.memos] };
          newState.memos[duplicateIndex].count += 1;
          if (currentImageAttachment) {
            newState.memos[duplicateIndex].imageUrl = currentImageAttachment;
          }
          updateState(newState);
          showToast('間違えた回数をカウントアップしました！');
        } else {
          const newMemo = {
            id: generateId(),
            folderId: currentFolderId,
            html: htmlContent,
            text: textContent,
            count: 1,
            imageUrl: currentImageAttachment
          };
          updateState({ ...appState, memos: [...appState.memos, newMemo] });
          showToast('新しいメモを追加しました');
        }
      }

      closeModal('memoModal');
      editingMemoId = null;
      currentImageAttachment = null;
    }

    function saveFolder() {
      const input = document.getElementById('folderInput');
      const name = input.value.trim();

      if (!name) {
        showToast('フォルダ名を入力してください');
        return;
      }

      if (editingFolderId) {
        const newState = {
          ...appState,
          folders: appState.folders.map(f => f.id === editingFolderId ? { ...f, name } : f)
        };
        updateState(newState);
        showToast('フォルダ名を変更しました');
      } else {
        const newFolder = {
          id: generateId(),
          name,
          parentId: currentFolderId
        };
        updateState({ ...appState, folders: [...appState.folders, newFolder] });
        showToast('新規フォルダを作成しました');
      }

      closeModal('folderModal');
      editingFolderId = null;
    }

    function openEditContextModal() {
      if (!contextMenuData) return;
      const { type, id } = contextMenuData;
      hideContextMenu();

      if (type === 'folder') {
        const folder = appState.folders.find(f => f.id === id);
        if (folder) {
          editingFolderId = id;
          document.getElementById('folderModalTitle').textContent = 'フォルダ名を編集';
          document.getElementById('folderInput').value = folder.name;
          openModal('folderModal');
        }
      } else if (type === 'memo') {
        const memo = appState.memos.find(m => m.id === id);
        if (memo) {
          editingMemoId = id;
          document.getElementById('memoModalTitle').textContent = 'メモを編集';
          document.getElementById('memoInput').innerHTML = memo.html || memo.text;
          
          if (memo.imageUrl) {
            currentImageAttachment = memo.imageUrl;
            document.getElementById('attachedImg').src = memo.imageUrl;
            document.getElementById('attachedImagePreview').classList.remove('hidden-force');
          } else {
            removeAttachedImage();
          }
          openModal('memoModal');
        }
      }
    }

    function requestDelete() {
      if (!contextMenuData) return;
      openModal('deleteConfirmModal');
    }

    function executeSingleDelete() {
      if (!contextMenuData) return;
      const { type, id } = contextMenuData;

      if (type === 'folder') {
        const idsToDelete = new Set([id]);
        
        function collectSubFolderIds(parentId) {
          appState.folders.filter(f => f.parentId === parentId).forEach(child => {
            idsToDelete.add(child.id);
            collectSubFolderIds(child.id);
          });
        }
        collectSubFolderIds(id);

        const newState = {
          folders: appState.folders.filter(f => !idsToDelete.has(f.id)),
          memos: appState.memos.filter(m => !idsToDelete.has(m.folderId))
        };
        updateState(newState);
        showToast('フォルダを削除しました');
      } else if (type === 'memo') {
        const newState = {
          ...appState,
          memos: appState.memos.filter(m => m.id !== id)
        };
        updateState(newState);
        showToast('メモを削除しました');
      }

      closeModal('deleteConfirmModal');
      hideContextMenu();
    }

    function getMovableFolders(targetId) {
      const invalidIds = new Set([targetId]);
      function collectChildren(id) {
        appState.folders.filter(f => f.parentId === id).forEach(child => {
          invalidIds.add(child.id);
          collectChildren(child.id);
        });
      }
      collectChildren(targetId);

      return appState.folders.filter(f => !invalidIds.has(f.id));
    }

    function executeFolderMove() {
      if (!folderToMove) return;
      const select = document.getElementById('moveTargetSelect');
      const targetParentId = select.value;

      const newState = {
        ...appState,
        folders: appState.folders.map(f => f.id === folderToMove ? { ...f, parentId: targetParentId } : f)
      };

      updateState(newState);
      closeModal('moveModal');
      folderToMove = null;
      showToast('フォルダを移動しました');
    }

    // --- Media & Drawing attachments ---
    document.getElementById('imageAttachmentInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        currentImageAttachment = event.target.result;
        document.getElementById('attachedImg').src = currentImageAttachment;
        document.getElementById('attachedImagePreview').classList.remove('hidden-force');
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    function removeAttachedImage() {
      currentImageAttachment = null;
      document.getElementById('attachedImg').src = '';
      document.getElementById('attachedImagePreview').classList.add('hidden-force');
    }

    function openCanvasModal() {
      openModal('drawModal');
      clearCanvas();
    }

    function setupCanvas() {
      const canvas = document.getElementById('paintCanvas');
      canvasCtx = canvas.getContext('2d');

      const getCoords = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      };

      const startDrawing = (e) => {
        isDrawing = true;
        const pos = getCoords(e);
        canvasCtx.beginPath();
        canvasCtx.moveTo(pos.x, pos.y);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const pos = getCoords(e);
        const size = document.getElementById('penSize').value;
        canvasCtx.lineTo(pos.x, pos.y);
        canvasCtx.strokeStyle = penColor;
        canvasCtx.lineWidth = size;
        canvasCtx.lineCap = 'round';
        canvasCtx.lineJoin = 'round';
        canvasCtx.stroke();
      };

      const stopDrawing = () => {
        isDrawing = false;
      };

      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseleave', stopDrawing);

      canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
      canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
      canvas.addEventListener('touchend', stopDrawing);
    }

    function setPenColor(color) {
      penColor = color;
    }

    function clearCanvas() {
      const canvas = document.getElementById('paintCanvas');
      if (canvasCtx) {
        canvasCtx.fillStyle = '#ffffff';
        canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    function applyCanvasDrawing() {
      const canvas = document.getElementById('paintCanvas');
      currentImageAttachment = canvas.toDataURL('image/png');
      document.getElementById('attachedImg').src = currentImageAttachment;
      document.getElementById('attachedImagePreview').classList.remove('hidden-force');
      closeModal('drawModal');
    }

      });

          <span class="text-xs text-gray-500 shrink-0">以上で</span>
          <select onchange="updateColorRule('${rule.id}', 'color', this.value)" class="flex-1 px-2 py-1 text-xs border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800">
            ${COLOR_OPTIONS.map(opt => `<option value="${opt.value}" ${opt.value === rule.color ? 'selected' : ''}>${opt.label}</option>`).join('')}

      `).join('');

    function addColorRule() {
      if (settings.colorRules.length >= 5) return;
      const newRule = { id: generateId(), count: 1, color: 'blue' };
      settings.colorRules.push(newRule);
      saveSettings();
    }

    function updateColorRule(id, key, val) {
      settings.colorRules = settings.colorRules.map(r => {
        if (r.id === id) {
          return { ...r, [key]: key === 'count' ? Math.max(1, parseInt(val) || 1) : val };
        }
        return r;
      });
      saveSettings();
    }

    function deleteColorRule(id) {
      settings.colorRules = settings.colorRules.filter(r => r.id !== id);
      saveSettings();
    }

    // --- File IO & Direct Code Load ---
    function switchLoadOption(opt) {

      const fileView = document.getElementById('loadOptionFileView');

        codeBtn.className = "p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-600 dark:text-gray-400 font-bold flex flex-col items-center gap-2 transition-all";

      } else {
        codeBtn.className = "p-4 rounded-xl border border-indigo-500 bg-indigo-50 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300 font-bold flex flex-col items-center gap-2 transition-all";
        fileBtn.className = "p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-600 dark:text-gray-400 font-bold flex flex-col items-center gap-2 transition-all";
        codeView.classList.remove('hidden-force');
        fileView.classList.add('hidden-force');
        setTimeout(() => document.getElementById('directCodeInput').focus(), 100);
      }
    }

    function executeLoadFromCode() {
      const rawCode = document.getElementById('directCodeInput').value.trim();
      if (!rawCode) {
        showToast('コードが入力されていません');
        return;
      }

      try {
        const parsed = JSON.parse(rawCode);
        if (parsed && parsed.folders && parsed.memos) {
          updateState(parsed);
          currentFolderId = 'root';
          renderAll();
          document.getElementById('directCodeInput').value = '';
          closeModal('loadModal');
          showToast("コードからデータを読み込みました");
        } else {
          showToast("無効なセーブデータフォーマットです");
        }
      } catch (err) {
        showToast("JSONコードの解析に失敗しました");
      }
    }

    async function executeSaveToFile() {
      const nameInput = document.getElementById('saveFileNameInput').value.trim();
      const fileName = nameInput ? `${nameInput}.json` : 'mistake_notes.json';
      const jsonString = JSON.stringify(appState, null, 2);
      
      try {
        if (window.showSaveFilePicker) {
          const handle = await window.showSaveFilePicker({
            suggestedName: fileName,
            types: [{
              description: 'JSON Files',
              accept: { 'application/json': ['.json'] },
            }],
          });
          const writable = await handle.createWritable();
          await writable.write(jsonString);
          await writable.close();
          showToast("指定された場所に保存しました");
        } else {
          const blob = new Blob([jsonString], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          a.click();
          URL.revokeObjectURL(url);
          showToast("ダウンロードフォルダに保存しました");
        }
      } catch (err) {
        if (err.name !== 'AbortError') showToast("保存に失敗しました");
      }
      closeModal('saveModal');
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const parsed = JSON.parse(event.target.result);
          if (parsed.folders && parsed.memos) {
            updateState(parsed);
            currentFolderId = 'root';
            renderAll();
            closeModal('loadModal');
            showToast("ファイルからデータを読み込みました");
          }
        } catch(err) {
          showToast("読み込みに失敗しました");
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    // --- UI Helpers & Events ---
    function openModal(id) {
      if (id === 'memoModal' && !editingMemoId) {
        document.getElementById('memoModalTitle').textContent = '記録を追加';
        document.getElementById('memoInput').innerHTML = '';
        removeAttachedImage();
      } else if (id === 'folderModal' && !editingFolderId) {
        document.getElementById('folderModalTitle').textContent = '新規フォルダ';
        document.getElementById('folderInput').value = '';
      }

      const el = document.getElementById(id);
      el.classList.remove('hidden-force');
      el.classList.add('flex');
      const input = el.querySelector('input, [contenteditable="true"]');
      if(input) setTimeout(() => input.focus(), 100);
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      el.classList.add('hidden-force');
      el.classList.remove('flex');

      if (id === 'memoModal') editingMemoId = null;
      if (id === 'folderModal') editingFolderId = null;
    }

    function showToast(msg) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = "bg-gray-900 text-white px-5 py-3 rounded-xl shadow-2xl text-sm font-medium animate-fade-in-up border border-gray-700";
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function showContextMenu() {
      if (!contextMenuData) return;
      const menu = document.getElementById('contextMenu');
      const moveBtn = document.getElementById('contextMoveBtn');
      
      if (contextMenuData.type === 'folder') {
        moveBtn.classList.remove('hidden-force');
      } else {
        moveBtn.classList.add('hidden-force');
      }

      menu.classList.remove('hidden-force');
      menu.classList.add('flex');
      
      let left = contextMenuData.x + 10;
      let top = Math.max(contextMenuData.y - 50, 10);
      
      if (left + 140 > window.innerWidth) left = window.innerWidth - 150;
      
      menu.style.left = `${left}px`;
      menu.style.top = `${top}px`;
    }

    function hideContextMenu() {
      const menu = document.getElementById('contextMenu');
      menu.classList.add('hidden-force');
      setTimeout(() => { contextMenuData = null; }, 50);
    }

    function setupEventListeners() {
      document.addEventListener('pointerdown', (e) => {
        if (!e.target.closest('#contextMenu') && contextMenuData) {
          hideContextMenu();
        }
      });

      document.getElementById('contextEditBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        openEditContextModal();
      });

      document.getElementById('contextDeleteBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        requestDelete();
      });

      document.getElementById('contextMoveBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (!contextMenuData || contextMenuData.type !== 'folder') return;
        folderToMove = contextMenuData.id;
        hideContextMenu();
        
        const select = document.getElementById('moveTargetSelect');
        select.innerHTML = '';
        const movableFolders = getMovableFolders(folderToMove);
        movableFolders.forEach(f => {
          const option = document.createElement('option');
          option.value = f.id;
          option.textContent = f.name;
          select.appendChild(option);
        });
        
        openModal('moveModal');
      });

      // Keyboard Shortcuts & Enter-to-Submit
      window.addEventListener('keydown', (e) => {
        if ((e.key === '¥' || e.key === '\\') && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) && !document.activeElement.isContentEditable) {
          e.preventDefault();
          openModal('memoModal');
        }

        if (e.key === 'Enter' && settings.enterToSubmit && !e.shiftKey) {
          if (!document.getElementById('memoModal').classList.contains('hidden-force')) {
            e.preventDefault();
            saveMemo();
          } else if (!document.getElementById('folderModal').classList.contains('hidden-force')) {
            e.preventDefault();
            saveFolder();
          }
        }

        if (e.ctrlKey && e.key === 'ArrowLeft') {
          e.preventDefault();
          const current = appState.folders.find(f => f.id === currentFolderId);
          if (current && current.parentId) {
            changeFolder(current.parentId);
          }
        }
      });
    }

    // Boot Application
    window.onload = init;
  </script>
</body>
</html>
